name: Arcflow CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build glslc spirv-tools libx11-dev libxext-dev
          libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev
      - name: Configure
        run: cmake --preset development -DARCFLOW_BUILD_GPU_TESTS=OFF
      - name: Validate and compile
        run: cmake --build --preset development --target arcflow_ci
      - name: Release configure
        run: cmake --preset release -DARCFLOW_BUILD_GPU_TESTS=OFF
      - name: Release build
        run: cmake --build --preset release --target arcflow_production_acceptance
      - uses: actions/upload-artifact@v4
        with:
          name: arcflow-linux-release
          path: |
            build/release/Arcflow-*
            build/release/arcflow-production-readiness.json
            build/release/symbols/*

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
      - name: Install installer tools
        run: choco install nsis --yes --no-progress
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-spirv-tools
      - name: Configure
        shell: msys2 {0}
        run: cmake --preset release -DARCFLOW_BUILD_GPU_TESTS=OFF
      - name: Build and test
        shell: msys2 {0}
        run: cmake --build --preset release --target arcflow_production_acceptance
      - name: Test portable Windows package
        shell: pwsh
        run: |
          $archive = Get-ChildItem build/release/Arcflow-*.zip | Select-Object -First 1
          Expand-Archive $archive.FullName "$env:RUNNER_TEMP/arcflow-portable"
          $compiler = Get-ChildItem "$env:RUNNER_TEMP/arcflow-portable" -Recurse -Filter arcflow_compiler.exe | Select-Object -First 1
          $env:PATH = "$env:WINDIR/System32;$env:WINDIR"
          & $compiler.FullName --validate "$($compiler.DirectoryName)/examples/guided-basics.afp"
          if ($LASTEXITCODE -ne 0) { throw 'Portable compiler failed without MSYS2 on PATH' }
          & "$($compiler.DirectoryName)/arcflow_runtime_sample.exe" "$($compiler.DirectoryName)/examples/guided-basics.afp"
          if ($LASTEXITCODE -ne 0) { throw 'Portable runtime sample failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: arcflow-windows-release
          path: |
            build/release/Arcflow-*
            build/release/arcflow-production-readiness.json
            build/release/symbols/*
