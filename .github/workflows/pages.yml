name: WebAssembly / GitHub Pages

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.ref }}
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Build editor and player
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake --preset web
          cmake --build --preset web --parallel 4
      - name: Test in Chromium
        run: |
          npm ci --prefix web
          npx --prefix web playwright install --with-deps chromium
          npm test --prefix web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/site
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.ref == ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
